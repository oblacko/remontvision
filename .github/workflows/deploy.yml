name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remont
          POSTGRES_PASSWORD: remont
          POSTGRES_DB: remontvision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remont -d remontvision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RV_DATABASE_URL: postgres://remont:remont@localhost:5432/remontvision
      ADMIN_KEY: test-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - name: Web lint and build
        working-directory: web
        run: npm ci && npm run lint && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog tests
        working-directory: catalog-service
        run: pip install -r requirements.txt && pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd /root/remontvision && git pull origin main && docker compose up -d --build && docker image prune -f && docker compose ps"

      - name: Post-deploy smoke
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://www.remontvision.ru/api/health) || true
            echo "$body"
            echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"payments_enabled":true' && echo "$body" | grep -q '"refunds_enabled":false' && curl -fsS https://www.remontvision.ru/ | grep -q 'id="root"' && curl -fsS -o /dev/null https://www.remontvision.ru/app && exit 0
            sleep 5
          done
          exit 1
