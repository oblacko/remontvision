name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/remontvision
            git pull origin main
            docker compose up -d --build
            docker image prune -f
            docker compose ps

      - name: Post-deploy smoke
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://www.remontvision.ru/api/health) || true
            echo "$body"
            echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"payments_enabled":true' && echo "$body" | grep -q '"refunds_enabled":false' && curl -fsS https://www.remontvision.ru/ | grep -q 'id="root"' && curl -fsS -o /dev/null https://www.remontvision.ru/app && exit 0
            sleep 5
          done
          exit 1
