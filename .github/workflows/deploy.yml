name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd /root/remontvision && git pull origin main && docker compose up -d --build && docker image prune -f && docker compose ps"

      - name: Post-deploy smoke
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://www.remontvision.ru/api/health) || true
            echo "$body"
            echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"payments_enabled":true' && echo "$body" | grep -q '"refunds_enabled":false' && curl -fsS https://www.remontvision.ru/ | grep -q 'id="root"' && curl -fsS -o /dev/null https://www.remontvision.ru/app && exit 0
            sleep 5
          done
          exit 1
