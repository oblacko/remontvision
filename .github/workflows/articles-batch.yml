name: articles-batch

# Пакетная генерация статей-рендеров на VPS. OpenRouter доступен с VPS только
# через настроенный прокси (app_settings proxy.url / HTTPS_PROXY): скрипт сам
# подгружает конфиг (loadProxyConfig), туннели и раннер не нужны.
# Ключи Wordstat — секрет KEYWORDS_CSV_B64 (gzip+base64; репозиторий публичный).
# Запуск: Actions → articles-batch → Run workflow.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Максимум кластеров style×room'
        required: true
        default: '8'
      publish:
        description: 'Публиковать после гейтов (true/false)'
        required: true
        default: 'true'
      fix_meta:
        description: 'Только починить meta_title у опубликованных (true/false)'
        required: true
        default: 'false'
      per_cluster:
        description: 'Сколько статей на кластер «стиль × комната» (по разным рендерам)'
        required: true
        default: '1'
      drafts_fix:
        description: 'Дожать черновики: расширить текст и опубликовать через гейты (true/false)'
        required: true
        default: 'false'

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: CSV на VPS и батч в контейнере приложения
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KEYWORDS_CSV_B64: ${{ secrets.KEYWORDS_CSV_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true
          printf '%s' "$KEYWORDS_CSV_B64" | base64 -d | gunzip > /tmp/keywords.csv
          wc -l /tmp/keywords.csv
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new /tmp/keywords.csv "$DEPLOY_USER@$DEPLOY_HOST:/tmp/keywords.csv"

          PUBLISH_FLAG=""
          if [ "${{ inputs.publish }}" = "true" ]; then PUBLISH_FLAG="--publish"; fi
          FIX_FLAG=""
          if [ "${{ inputs.fix_meta }}" = "true" ]; then FIX_FLAG="--fix-meta"; fi
          DRAFTS_FLAG=""
          if [ "${{ inputs.drafts_fix }}" = "true" ]; then DRAFTS_FLAG="--publish-drafts"; fi

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker compose -f /root/remontvision/docker-compose.yml cp /tmp/keywords.csv app:/tmp/keywords.csv && \
             docker compose -f /root/remontvision/docker-compose.yml exec -T app \
               node scripts/generate-articles-batch.mjs --csv /tmp/keywords.csv --limit ${{ inputs.limit }} --per-cluster ${{ inputs.per_cluster }} $PUBLISH_FLAG $FIX_FLAG $DRAFTS_FLAG"
