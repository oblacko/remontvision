name: articles-batch

# Пакетная генерация статей-рендеров. OpenRouter блокирует chat/completions
# с IP VPS ("Access denied by security policy"), поэтому батч исполняется на
# раннере GitHub (другой egress), а к прод-БД и catalog-service доступ — через
# SSH-туннели (те же ключи, что у деплоя). Ключи Wordstat — секрет
# KEYWORDS_CSV_B64 (gzip+base64; репозиторий публичный).
# Запуск: Actions → articles-batch → Run workflow.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Максимум кластеров style×room'
        required: true
        default: '8'
      publish:
        description: 'Публиковать после гейтов (true/false)'
        required: true
        default: 'true'

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Туннели к прод-БД и catalog-service, затем батч на раннере
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KEYWORDS_CSV_B64: ${{ secrets.KEYWORDS_CSV_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -R "$DEPLOY_HOST" 2>/dev/null || true

          # env приложения с VPS (в файл, без вывода в лог); порт БД — на туннель,
          # catalog — на туннель. Дубликаты: последнее значение побеждает.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "grep -E '^(RV_DATABASE_URL|OPENROUTER_API_KEY|CATALOG_SERVICE_URL|CATALOG_SERVICE_TOKEN|ARTICLE_MODEL)=' /root/remontvision/.env" > /tmp/prod.env
          sed -i -E 's/127\.0\.0\.1:5434/127.0.0.1:15434/' /tmp/prod.env
          printf '%s\n' 'CATALOG_SERVICE_URL=http://127.0.0.1:18000' 'OPENROUTER_BASE=https://openrouter.ai/api/v1' >> /tmp/prod.env
          grep -c '=' /tmp/prod.env
          grep '^RV_DATABASE_URL=' /tmp/prod.env | sed -E 's/:[^:@]+@/:***@/'

          # IP контейнера БД: туннель ведём НАПРЯМУЮ в контейнер (иначе подключение
          # идёт с 127.0.0.1 и попадает под другое правило pg_hba — пароль не принимается)
          DB_IP="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \$(docker compose -f /root/remontvision/docker-compose.yml ps -q db)")"
          echo "db_ip=${DB_IP:-empty}"
          TARGET="${DB_IP:-127.0.0.1}"
          TPORT="5432"
          if [ -z "$DB_IP" ]; then TARGET="127.0.0.1"; TPORT="5434"; fi

          # туннели: 15434 → postgres (контейнер), 18000 → catalog-service VPS
          ssh -f -N -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -L 15434:"$TARGET":"$TPORT" -L 18000:127.0.0.1:8000 "$DEPLOY_USER@$DEPLOY_HOST"
          sleep 3

          printf '%s' "$KEYWORDS_CSV_B64" | base64 -d | gunzip > /tmp/keywords.csv
          wc -l /tmp/keywords.csv

          PUBLISH_FLAG=""
          if [ "${{ inputs.publish }}" = "true" ]; then PUBLISH_FLAG="--publish"; fi

          node scripts/generate-articles-batch.mjs --csv /tmp/keywords.csv --env-file /tmp/prod.env --limit "${{ inputs.limit }}" $PUBLISH_FLAG 2>&1 | grep -vE '^\{"ts"'
